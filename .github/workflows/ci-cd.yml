name: CI/CD Pipeline for DemoApp

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      # Setup MongoDB service container
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        # Simplified health check to improve reliability
        options: >-
          --name demo-mongodb
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      # Added step to verify MongoDB connection
      - name: Verify MongoDB Connection
        run: |
          echo "Waiting for MongoDB to be ready..."
          timeout 60s bash -c 'until mongosh --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do sleep 2; done'
          echo "MongoDB is up and running!"
      
      - name: Build and Test with Maven
        run: mvn clean verify
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/demodb
      
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: target/site/jacoco/
  
  # Simplified to just build Docker image without pushing for now
  build-docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: demoapp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
