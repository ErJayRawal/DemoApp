apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-provisioning
  namespace: demoapp
data:
  dashboard.yaml: |-
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
