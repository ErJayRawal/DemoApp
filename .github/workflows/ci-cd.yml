name: CI/CD Pipeline for DemoApp

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      # Setup MongoDB service container
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        # Simplified health check to improve reliability
        options: >-
          --name demo-mongodb
          --health-cmd mongosh --eval "db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      # Added step to verify MongoDB connection
      - name: Verify MongoDB Connection
        run: |
          echo "Waiting for MongoDB to be ready..."
          timeout 60s bash -c 'until mongosh --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do sleep 2; done'
          echo "MongoDB is up and running!"
      
      - name: Build and Test with Maven
        run: mvn clean verify
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/demodb
      
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: target/site/jacoco/
  
  build-and-push-docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demoapp:latest,${{ secrets.DOCKERHUB_USERNAME }}/demoapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Update Kubernetes manifests
        run: |
          # Update the image tag in the deployment.yaml file
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/demoapp:${{ github.sha }}|g" k8s/deployment.yaml
      
      - name: Deploy to Kubernetes
        run: |
          # Create namespace if it doesn't exist
          kubectl apply -f k8s/namespace.yaml
          
          # Apply all Kubernetes manifests using kustomize
          kubectl apply -k k8s/
          
          # Wait for deployment to complete
          kubectl rollout status deployment/demoapp -n demoapp --timeout=180s
      
      - name: Verify deployment
        run: |
          # Check if pods are running
          kubectl get pods -n demoapp
          
          # Check if service is available
          kubectl get svc -n demoapp
          
          # Check if ingress is configured
          kubectl get ingress -n demoapp
