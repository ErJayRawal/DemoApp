spring.data.mongodb.host=demo-mongodb
spring.data.mongodb.port=27017
spring.data.mongodb.database=demodb

# Actuator configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers,env,mappings,beans,caches
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Prometheus metrics configuration
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=demoapp

# Tracing configuration
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# MongoDB metrics
management.metrics.mongo.command.enabled=true
management.metrics.mongo.connectionpool.enabled=true

# Debug logging for metrics and actuator
logging.level.io.micrometer=DEBUG
logging.level.org.springframework.boot.actuate=DEBUG
logging.level.com.example.demoapp=DEBUG

# Ensure custom metrics are published
management.metrics.enable.all=true
